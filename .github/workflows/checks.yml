# AI-written glue. Steps copied from validate.yml (actions/checkout@v4, oven-sh/setup-bun@v2).
# tsc catches what the bundler does not (a missing import, a wrong type); vendored checks the Aegires files against the pinned commit.
name: Checks

on:
  push:
    branches: [main, valenced-port]
  workflow_dispatch:

jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }}
      - run: bunx tsc -b plugins/e2ee/tsconfig.json
      # Lint only, with the template's biome.json. Formatting is not enforced.
      - run: bunx biome lint plugins/e2ee/js

  vendored:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/verify-vendored.sh
