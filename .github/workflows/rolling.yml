# AI-written. Rolling beta channel: every push to valenced-port publishes `<manifest version>-b<run number>` to the pool,
# built and published with the same scripts as release.yml. Valenced's update check follows the `beta` channel, and
# stable users never see these (README "Channels": `latest` never points at a labeled version).
# The manifest version is only changed inside this CI run. It must stay above the last stable version
# (a labeled version sorts below its bare version), and the zero-padded number keeps the builds in order.
# No tags or GitHub Releases are written for these builds.

name: Rolling beta

on:
  push:
    branches: [valenced-port]
  workflow_dispatch:

# Same group as release.yml and publish-index.yml: only one job writes to the pool at a time.
concurrency:
  group: publish-pool
  cancel-in-progress: false

permissions:
  contents: write

env:
  POOL_BRANCH: ${{ vars.POOL_BRANCH }}
  PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
  POOL_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
  PLAN: ${{ github.workspace }}/releases.json

jobs:
  rolling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - run: bun install

      - name: Version this build as a beta
        run: |
          manifest=plugins/e2ee/manifest.json
          version="$(jq -r .version "$manifest")-b$(printf '%05d' "$GITHUB_RUN_NUMBER")"
          jq --arg v "$version" '.version = $v' "$manifest" > manifest.tmp
          mv manifest.tmp "$manifest"
          echo "Publishing $version"

      - name: Check out the published pool
        run: .github/scripts/checkout-pool.sh

      - name: Plan releases
        id: plan
        run: .github/scripts/plan-releases.sh

      - name: Build plugins
        if: steps.plan.outputs.count != '0'
        run: ./gradlew --no-daemon packageAllPlugins
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }} # For Gradle to download the API dependency.

      - name: Publish to the pool
        if: steps.plan.outputs.count != '0'
        run: .github/scripts/publish-pool.sh
