# AI-written glue. Steps copied from validate.yml.
name: Branch build
on:
  push:
    branches: [valenced-port]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Build e2ee
        run: ./gradlew --no-daemon packageE2ee
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: e2ee
          path: build/dist/*.zip
